name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev patchelf pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --lib

      - name: Test
        run: cargo test --workspace

      - name: Docs
        run: cargo doc --workspace --no-deps

  python-tools:
    name: Python Tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Test span generator
        working-directory: tools/span-generator
        run: uv run pytest

  wheel:
    name: Wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev patchelf pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Build wheel
        run: uvx maturin build --release --manifest-path crates/charstreamer-python/Cargo.toml --out dist

      - name: Check wheel metadata
        run: uvx twine check dist/*.whl

      - name: Check wheel contains usable model
        run: python3 tools/model-artifacts/check_wheel_model.py --require-burn dist/*.whl

      - name: Smoke-test wheel
        env:
          CHARSTREAMER_AUTO_DOWNLOAD: "0"
        run: |
          uv run --isolated --with ./dist/charstreamer-*.whl python - <<'PY'
          import charstreamer

          info = charstreamer.model_info(allow_download=False, require_model=True)
          segmenter = charstreamer.Segmenter.default(allow_download=False, require_model=True)
          annotation = segmenter.annotate("The court reviewed the invoice. Notice was timely.")
          assert info["resolved"] is True
          assert info["source"] == "bundled"
          assert annotation["spans"]
          print(info)
          PY

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: charstreamer-wheel
          path: dist/*.whl

name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --lib

      - name: Test
        run: cargo test --workspace

      - name: Docs
        run: cargo doc --workspace --no-deps

  python-tools:
    name: Python Tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Test span generator
        working-directory: tools/span-generator
        run: uv run pytest

  wheel:
    name: Wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Build wheel
        run: uvx maturin build --release --manifest-path crates/charstreamer-python/Cargo.toml --out dist

      - name: Check wheel metadata
        run: uvx twine check dist/*

      - name: Smoke-test wheel
        run: |
          uv run --isolated --with ./dist/charstreamer-*.whl python - <<'PY'
          import charstreamer

          text = "# Background\nThe court reviewed the invoice. The shipment was late.\n\n- Notice was timely.\n"
          annotation = charstreamer.Segmenter.default().annotate(text)
          assert annotation["spans"]
          assert "tagged" in annotation
          print(len(annotation["spans"]))
          PY

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: charstreamer-wheel
          path: dist/*.whl

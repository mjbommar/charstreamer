name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  wheel:
    name: Build And Publish Wheel
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/charstreamer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Validate release tag
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          version="${tag#v}"
          package_version="$(python3 - <<'PY'
          import tomllib
          with open("crates/charstreamer-python/pyproject.toml", "rb") as fh:
              print(tomllib.load(fh)["project"]["version"])
          PY
          )"
          if [[ "$package_version" != "$version" ]]; then
            echo "tag $tag does not match PyPI package version $package_version" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build wheel
        run: uvx maturin build --release --manifest-path crates/charstreamer-python/Cargo.toml --out dist

      - name: Check wheel metadata
        run: uvx twine check dist/*

      - name: Smoke-test wheel
        run: |
          uv run --isolated --with ./dist/charstreamer-*.whl python - <<'PY'
          import charstreamer

          text = "# Background\nThe court reviewed the invoice. The shipment was late.\n\n- Notice was timely.\n"
          annotation = charstreamer.Segmenter.default().annotate(text)
          assert annotation["spans"]
          assert annotation["tagged"].startswith("<|")
          print(len(annotation["spans"]))
          PY

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          user: ${{ secrets.PYPI_USERNAME }}
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.whl \
            --title "CharStreamer ${RELEASE_TAG}" \
            --notes-file CHANGELOG.md

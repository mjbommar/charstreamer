name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string
      model_artifact_url:
        description: "URL to a validated charstreamer-default model .zip"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  prepare:
    name: Prepare Release Inputs
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate release tag
        id: release
        shell: bash
        run: |
          tag="${{ inputs.tag }}"
          version="${tag#v}"
          package_version="$(python - <<'PY'
          import tomllib
          with open("crates/charstreamer-python/pyproject.toml", "rb") as fh:
              print(tomllib.load(fh)["project"]["version"])
          PY
          )"
          if [[ "$package_version" != "$version" ]]; then
            echo "tag $tag does not match PyPI package version $package_version" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Prepare model bundle
        shell: bash
        env:
          MODEL_ARTIFACT_URL: ${{ inputs.model_artifact_url }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p dist-models
          if [[ -n "$MODEL_ARTIFACT_URL" ]]; then
            model_source="dist-models/model-source.zip"
            curl -fsSL "$MODEL_ARTIFACT_URL" -o "$model_source"
          else
            model_source="crates/charstreamer-python/python/charstreamer/models/default"
          fi
          python tools/model-artifacts/vendor_model.py \
            --require-burn \
            --archive-out "dist-models/charstreamer-default-${VERSION}.zip" \
            "$model_source"

      - name: Upload model bundle
        uses: actions/upload-artifact@v7
        with:
          name: charstreamer-model-bundle
          path: dist-models/charstreamer-default-${{ steps.release.outputs.version }}.zip

  wheel:
    name: Wheel ${{ matrix.id }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x86_64
            os: ubuntu-24.04
          - id: linux-aarch64
            os: ubuntu-24.04-arm
          - id: macos-x86_64
            os: macos-15-intel
            delocate_arch: x86_64
          - id: macos-aarch64
            os: macos-15
            delocate_arch: arm64
          - id: windows-x86_64
            os: windows-2025
            vcpkg_triplet: x64-windows
          - id: windows-aarch64
            os: windows-11-arm
            vcpkg_triplet: arm64-windows
    steps:
      - uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download model bundle
        uses: actions/download-artifact@v7
        with:
          name: charstreamer-model-bundle
          path: dist-models

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev patchelf pkg-config

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install openblas pkg-config gcc
          openblas_prefix="$(brew --prefix openblas)"
          gcc_prefix="$(brew --prefix gcc)"
          gcc_lib="$gcc_prefix/lib/gcc/current"
          {
            echo "OPENBLAS_DIR=$openblas_prefix"
            echo "PKG_CONFIG_PATH=$openblas_prefix/lib/pkgconfig:$PKG_CONFIG_PATH"
            echo "DYLD_FALLBACK_LIBRARY_PATH=$openblas_prefix/lib:$gcc_lib:$DYLD_FALLBACK_LIBRARY_PATH"
            echo "LIBRARY_PATH=$openblas_prefix/lib:$gcc_lib:$LIBRARY_PATH"
            echo "LD_LIBRARY_PATH=$openblas_prefix/lib:$gcc_lib:$LD_LIBRARY_PATH"
            echo "RUSTFLAGS=${RUSTFLAGS:-} -C link-arg=-Wl,-rpath,$openblas_prefix/lib -C link-arg=-Wl,-rpath,$gcc_lib"
          } >> "$GITHUB_ENV"

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot) {
            $vcpkgRoot = "C:\vcpkg"
          }
          if (-not (Test-Path "$vcpkgRoot\vcpkg.exe")) {
            $vcpkgRoot = "$env:RUNNER_TEMP\vcpkg"
            git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot
            & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          }
          & "$vcpkgRoot\vcpkg.exe" install openblas:${{ matrix.vcpkg_triplet }}
          "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
          "VCPKG_DEFAULT_TRIPLET=${{ matrix.vcpkg_triplet }}" >> $env:GITHUB_ENV
          "VCPKGRS_DYNAMIC=1" >> $env:GITHUB_ENV
          "$vcpkgRoot\installed\${{ matrix.vcpkg_triplet }}\bin" >> $env:GITHUB_PATH

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Vendor model bundle
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python tools/model-artifacts/vendor_model.py \
            --require-burn \
            "dist-models/charstreamer-default-${VERSION}.zip"

      - name: Build wheel
        shell: bash
        run: uvx maturin build --release --manifest-path crates/charstreamer-python/Cargo.toml --out dist

      - name: Repair macOS wheel
        if: runner.os == 'macOS'
        shell: bash
        run: |
          uvx --from delocate delocate-wheel \
            --require-archs "${{ matrix.delocate_arch }}" \
            -w wheelhouse \
            dist/*.whl
          rm dist/*.whl
          mv wheelhouse/*.whl dist/

      - name: Repair Windows wheel
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path wheelhouse | Out-Null
          $wheel = Get-ChildItem dist\*.whl | Select-Object -First 1
          uvx --from delvewheel delvewheel repair `
            --add-path "$env:VCPKG_ROOT\installed\${{ matrix.vcpkg_triplet }}\bin" `
            --wheel-dir wheelhouse `
            $wheel.FullName
          Remove-Item dist\*.whl
          Move-Item wheelhouse\*.whl dist\

      - name: Check wheel metadata
        shell: bash
        run: uvx twine check dist/*.whl

      - name: Check wheel contains usable model
        shell: bash
        run: |
          for wheel in dist/*.whl; do
            python tools/model-artifacts/check_wheel_model.py --require-burn "$wheel"
          done

      - name: Smoke-test wheel
        shell: bash
        env:
          CHARSTREAMER_AUTO_DOWNLOAD: "0"
        run: |
          wheel="$(python - <<'PY'
          from pathlib import Path
          wheels = sorted(Path("dist").glob("charstreamer-*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected one wheel, found {len(wheels)}")
          print(wheels[0].as_posix())
          PY
          )"
          uv run --isolated --with "$wheel" python - <<'PY'
          import charstreamer

          info = charstreamer.model_info(allow_download=False, require_model=True)
          text = "# Background\nThe court reviewed the invoice. The shipment was late.\n\n- Notice was timely.\n"
          annotation = charstreamer.Segmenter.default(allow_download=False, require_model=True).annotate(text)
          assert info["resolved"] is True
          assert info["source"] == "bundled"
          assert annotation["spans"]
          assert annotation["tagged"].startswith("<|")
          print(info)
          print(len(annotation["spans"]))
          PY

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: charstreamer-wheel-${{ matrix.id }}
          path: dist/*.whl

  sdist:
    name: Source Distribution
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download model bundle
        uses: actions/download-artifact@v7
        with:
          name: charstreamer-model-bundle
          path: dist-models

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Vendor model bundle
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python tools/model-artifacts/vendor_model.py \
            --require-burn \
            "dist-models/charstreamer-default-${VERSION}.zip"

      - name: Build sdist
        shell: bash
        run: uvx maturin sdist --manifest-path crates/charstreamer-python/Cargo.toml --out dist

      - name: Check sdist metadata
        shell: bash
        run: uvx twine check dist/*.tar.gz

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v7
        with:
          name: charstreamer-sdist
          path: dist/*.tar.gz

  publish:
    name: Publish Release
    needs:
      - prepare
      - wheel
      - sdist
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/charstreamer
    steps:
      - uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download wheel artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: charstreamer-wheel-*
          path: dist
          merge-multiple: true

      - name: Download sdist artifact
        uses: actions/download-artifact@v7
        with:
          name: charstreamer-sdist
          path: dist

      - name: Download model bundle
        uses: actions/download-artifact@v7
        with:
          name: charstreamer-model-bundle
          path: dist-models

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Check distribution metadata
        shell: bash
        run: uvx twine check dist/*

      - name: Check wheels contain usable model
        shell: bash
        run: |
          for wheel in dist/*.whl; do
            python tools/model-artifacts/check_wheel_model.py --require-burn "$wheel"
          done

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          user: ${{ secrets.PYPI_USERNAME }}
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          assets=(dist/*)
          if compgen -G "dist-models/*.zip" > /dev/null; then
            assets+=(dist-models/*.zip)
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "CharStreamer ${RELEASE_TAG}" \
              --notes-file CHANGELOG.md
          fi

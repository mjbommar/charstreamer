name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string
      model_artifact_url:
        description: "URL to a validated charstreamer-default model .zip"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  wheel:
    name: Build And Publish Wheel
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/charstreamer
    steps:
      - uses: actions/checkout@v6

      - name: Validate release tag
        id: release
        shell: bash
        run: |
          tag="${{ inputs.tag }}"
          version="${tag#v}"
          package_version="$(python3 - <<'PY'
          import tomllib
          with open("crates/charstreamer-python/pyproject.toml", "rb") as fh:
              print(tomllib.load(fh)["project"]["version"])
          PY
          )"
          if [[ "$package_version" != "$version" ]]; then
            echo "tag $tag does not match PyPI package version $package_version" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev patchelf pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Vendor model artifact
        env:
          MODEL_ARTIFACT_URL: ${{ inputs.model_artifact_url }}
        run: |
          mkdir -p dist/models
          if [[ -z "$MODEL_ARTIFACT_URL" ]]; then
            MODEL_ARTIFACT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.release.outputs.tag }}/charstreamer-default-${{ steps.release.outputs.version }}.zip"
          fi
          curl -fsSL "$MODEL_ARTIFACT_URL" -o "dist/models/charstreamer-default-${{ steps.release.outputs.version }}.zip"
          python3 tools/model-artifacts/vendor_model.py \
            --require-burn \
            --archive-out "dist/models/charstreamer-default-${{ steps.release.outputs.version }}.zip" \
            "dist/models/charstreamer-default-${{ steps.release.outputs.version }}.zip"

      - name: Build wheel
        run: uvx maturin build --release --manifest-path crates/charstreamer-python/Cargo.toml --out dist

      - name: Check wheel metadata
        run: uvx twine check dist/*.whl

      - name: Check wheel contains usable model
        run: python3 tools/model-artifacts/check_wheel_model.py --require-burn dist/*.whl

      - name: Smoke-test wheel
        env:
          CHARSTREAMER_AUTO_DOWNLOAD: "0"
        run: |
          uv run --isolated --with ./dist/charstreamer-*.whl python - <<'PY'
          import charstreamer

          info = charstreamer.model_info(allow_download=False, require_model=True)
          text = "# Background\nThe court reviewed the invoice. The shipment was late.\n\n- Notice was timely.\n"
          annotation = charstreamer.Segmenter.default().annotate(text)
          assert annotation["spans"]
          assert annotation["tagged"].startswith("<|")
          print(info)
          print(len(annotation["spans"]))
          PY

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          user: ${{ secrets.PYPI_USERNAME }}
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          assets=(dist/*.whl)
          if compgen -G "dist/models/*.zip" > /dev/null; then
            assets+=(dist/models/*.zip)
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "CharStreamer ${RELEASE_TAG}" \
              --notes-file CHANGELOG.md
          fi
